name: Daily slate

# Five runs a day, because confirmed lineups are worth chasing: MLB posts them only
# ~2-4h before each game's first pitch, and start times are staggered from early
# afternoon to late evening. One afternoon run would leave whole games on projected
# lineups all day.
#
#   13:07 UTC  09:07 ET  FULL pull   - stats + projected lineups (the early read)
#   15:37 UTC  11:37 ET  reuse       - day games (~13:05 ET) now confirmed
#   18:07 UTC  14:07 ET  reuse       - late-afternoon games confirmed
#   21:07 UTC  17:07 ET  reuse       - evening games confirmed
#   23:07 UTC  19:07 ET  reuse       - late/west-coast games confirmed
#
# The odd minutes are deliberate. GitHub's scheduler is best-effort and queues the
# whole platform at the top of every hour, so ':00' jobs are routinely delayed by
# tens of minutes and are sometimes dropped outright. Seven minutes past is far
# less contended for no practical difference in timing.
#
# Cost control: only the 13:00 run downloads from Baseball Savant. Season stats do not
# change during the day, so the later runs restore that download from the cache and
# refresh lineups only — roughly 2 minutes instead of 10. That keeps the month near
# 900 of the 2,000 free Actions minutes a private repo gets, rather than blowing past
# it. It is also far politer to Savant.
#
# The five daily runs are dispatched by Netlify scheduled functions, not by GitHub —
# see the note on the `on:` block below for why. The dashboard's Update Now button
# hits the same workflow_dispatch entry point.

on:
  # NO `schedule:` here on purpose.
  #
  # Netlify's scheduled functions drive the five daily runs (see
  # netlify/functions/scheduled-slate*.mjs). GitHub's own scheduler was added first,
  # failed to fire for a full day, and Netlify was brought in to replace it — but the
  # GitHub block was left in place as a backstop. When GitHub's scheduler recovered,
  # every slot began firing twice, and `cancel-in-progress: false` meant the duplicate
  # queued and ran to completion rather than being dropped. That doubled consumption
  # to ~110 minutes a day and exhausted the 2,000 free monthly minutes by the 18th.
  #
  # One scheduler only. If Netlify's ever proves unreliable, move the schedule back
  # here and remove the Netlify functions — but never run both.
  workflow_dispatch:
    inputs:
      slate_date:
        description: 'Slate date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string
      window:
        description: 'Recent-form window'
        required: false
        default: 'L10'
        type: choice
        options: ['L10', 'L5']
      full_pull:
        description: 'Re-download everything from Savant (slower)'
        required: false
        default: false
        type: boolean
      run_kind:
        description: 'Which slot dispatched this. Netlify sets it; leave blank by hand.'
        required: false
        default: ''
        type: string

concurrency:
  group: propline-slate
  # Cancel rather than queue. Two overlapping dispatches produce the same board, so
  # letting both run to completion only doubles the minutes — which is exactly how the
  # free tier was exhausted on 18 Aug.
  cancel-in-progress: true

jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Without this the odds fetch raises "no key", process.py catches it and carries
      # on, and every scheduled run publishes with empty market columns — while local
      # runs work fine because .env has the key. It failed silently for days.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Work out the slate, the run type, and whether to re-download
        id: cfg
        # Inputs arrive as environment variables rather than being spliced into the
        # script text. A `${{ }}` expression inside `run:` is substituted before the
        # shell parses the line, so a crafted value could otherwise escape the quotes.
        env:
          IN_DATE: ${{ inputs.slate_date }}
          IN_KIND: ${{ inputs.run_kind }}
          IN_FULL: ${{ inputs.full_pull }}
        run: |
          DATE="$IN_DATE"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # The label comes from whoever dispatched us: Netlify's scheduled functions
          # send run_kind, and the dashboard's Update Now button does not — so a
          # hand-triggered run is correctly reported as manual.
          #
          # This previously switched on `github.event.schedule`, which has been empty
          # ever since the `schedule:` trigger was removed (see the note above). Every
          # run therefore fell through to `manual`: the dashboard reported automated
          # runs as hand-triggered, and the morning full pull never took effect.
          #
          # Matching against a fixed list rather than trusting the value keeps an
          # arbitrary string out of the run label and out of the filenames built from it.
          case "$IN_KIND" in
            scheduled_morning)
              KIND="$IN_KIND"; REUSE=false ;;
            scheduled_midday|scheduled_afternoon|scheduled_evening|scheduled_late)
              KIND="$IN_KIND"; REUSE=true  ;;
            *)
              KIND=manual;     REUSE=true  ;;
          esac

          # A manual run defaults to reusing the cache; tick full_pull to force a
          # fresh download.
          if [ "$IN_FULL" = "true" ]; then REUSE=false; fi

          echo "kind=$KIND"   >> "$GITHUB_OUTPUT"
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"
          echo "Slate $DATE — $KIND (reuse cached Savant data: $REUSE)"

      # Restores this slate's Savant download so the later runs of the day do not
      # re-fetch ~70MB of pitch data. On a miss, collect.py falls back to a full pull
      # on its own, so a cold cache degrades gracefully rather than failing.
      - name: Restore today's Savant download
        uses: actions/cache@v4
        with:
          path: data/raw/${{ steps.cfg.outputs.date }}
          key: savant-${{ steps.cfg.outputs.date }}

      - name: Collect
        run: |
          EXTRA=""
          if [ "${{ steps.cfg.outputs.reuse }}" = "true" ]; then EXTRA="--reuse-raw"; fi
          python scripts/collect.py \
            --date "${{ steps.cfg.outputs.date }}" \
            --run-kind "${{ steps.cfg.outputs.kind }}" \
            $EXTRA

      - name: Process and publish
        run: |
          python scripts/process.py \
            --date "${{ steps.cfg.outputs.date }}" \
            --window "${{ inputs.window || 'L10' }}" \
            --run-kind "${{ steps.cfg.outputs.kind }}" \
            --publish

      - name: Keep the picks workbook downloadable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: props-${{ steps.cfg.outputs.date }}-${{ steps.cfg.outputs.kind }}
          path: data/picks/*.xlsx
          if-no-files-found: warn
          retention-days: 30
